name: Test Python Scripts

# Kích hoạt khi bạn bấm nút chạy bằng tay trên web
on:
  workflow_dispatch:

jobs:
  run-code:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải code từ repository vào máy ảo GitHub
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cài đặt các thư viện cần thiết từ file requirements.txt của bạn
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Kích hoạt chạy file Python chính để kiểm tra (mặc định thử file run.py)
      - name: Run Main Script
        run: |
          python run.py
